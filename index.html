<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="AKASHI — independent visual practice across art, generative systems, photography and experimental work.">
<title>AKASHI — Visual Archive</title>
<style>
:root{color-scheme:dark;--bg:#070708;--fg:#f3f1f4;--muted:#96919b;--line:rgba(255,255,255,.17);--gutter:clamp(24px,5vw,76px);--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100svh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.site{min-height:100svh;padding:0 var(--gutter);display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate}
.site:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 77% 80%,var(--glow-a),transparent 42%),radial-gradient(ellipse at 65% 56%,var(--glow-b),transparent 40%),#070708;transition:background 0s}
.site:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:4px 4px}
.header{height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:relative;z-index:5;flex-shrink:0}
.brand{display:flex;align-items:center;gap:24px}
.mark{width:76px;height:34px;display:block}
.brand-name{font-size:13px;letter-spacing:.48em;font-weight:400}
.header-right{display:flex;align-items:center;gap:clamp(22px,3vw,48px)}
.header-right a,.menu{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#c8c4ca}
.header-right a:hover{color:#fff}
.menu{display:none;border:0;background:none;padding:12px;cursor:pointer}
.hero{flex:1;min-height:620px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);position:relative}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:60px 30px 80px 4px;position:relative;z-index:2}
.eyebrow{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}
h1{font-size:clamp(58px,9vw,132px);line-height:.9;letter-spacing:.22em;font-weight:300;margin:0 0 22px;padding-left:.22em}
.subline{font:10px var(--mono);letter-spacing:.48em;text-transform:uppercase;color:#c9c4cc;margin-left:5px}
.rule{width:54px;height:1px;background:#f0edf2;margin:44px 0 0 5px}
.hero-index{position:absolute;left:5px;bottom:42px;font:10px var(--mono);letter-spacing:.18em;color:#b7b1bb}
.gradient-stage{position:relative;min-height:100%;border-left:1px solid var(--line);border-right:1px solid var(--line);background:linear-gradient(90deg,transparent 0 50%,rgba(255,255,255,.025) 50% 50.15%,transparent 50.15%),linear-gradient(0deg,transparent 0 49.8%,rgba(255,255,255,.16) 49.8% 50%,transparent 50%);overflow:hidden}
.gradient-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at var(--hot-x,78%) var(--hot-y,78%),var(--glow-a) 0,transparent 47%),radial-gradient(ellipse at 45% 65%,var(--glow-b),transparent 46%);filter:saturate(1.22);opacity:.98}
.gradient-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 33.2%,var(--line) 33.2% 33.35%,transparent 33.35% 66.5%,var(--line) 66.5% 66.65%,transparent 66.65%),linear-gradient(0deg,transparent 0 33.2%,var(--line) 33.2% 33.35%,transparent 33.35% 66.5%,var(--line) 66.5% 66.65%,transparent 66.65%);pointer-events:none}
.stage-cross{position:absolute;width:12px;height:12px;border:1px solid rgba(255,255,255,.7);left:66.6%;top:66.6%;transform:translate(-50%,-50%);z-index:2}
.stage-count{position:absolute;bottom:38px;right:34px;z-index:2;font:10px var(--mono);letter-spacing:.18em;color:#eee}
.stage-arrows{position:absolute;bottom:31px;left:34px;z-index:2;display:flex;gap:22px;font-size:20px;color:#f5edf7}
.category-bar{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);min-height:82px;flex-shrink:0}
.category-bar a{display:flex;align-items:center;gap:14px;padding:0 18px;border-right:1px solid var(--line);font-size:13px;letter-spacing:.01em;transition:background .25s}
.category-bar a:first-child{border-left:1px solid var(--line)}
.category-bar a:hover{background:rgba(255,255,255,.055)}
.category-bar .num{font:10px var(--mono);color:#8f8994}
.footer{min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#77717c;font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.menu-panel{display:none;position:absolute;z-index:8;top:78px;right:var(--gutter);width:min(300px,calc(100vw - 2*var(--gutter)));padding:24px;background:#101013;border:1px solid var(--line);flex-direction:column;gap:20px}
.menu-panel.open{display:flex}
.menu-panel a{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#e4dfe7}
@media(max-width:760px){
 .site{padding:0 18px}
 .header{height:76px}
 .brand{gap:13px}.mark{width:58px;height:28px}.brand-name{font-size:10px;letter-spacing:.38em}
 .header-right{display:none}.menu{display:block}
 .hero{min-height:unset;flex:1;grid-template-columns:1fr;grid-template-rows:minmax(250px,42svh) minmax(220px,34svh)}
 .hero-copy{padding:38px 8px 28px;justify-content:center}
 .eyebrow{margin-bottom:23px;font-size:9px}
 h1{font-size:clamp(48px,13vw,76px);letter-spacing:.19em;padding-left:.19em;margin-bottom:16px}
 .subline{font-size:9px;letter-spacing:.35em}
 .rule{margin-top:26px}
 .hero-index{bottom:18px;left:8px;font-size:9px}
 .gradient-stage{border:1px solid var(--line);border-bottom:0;min-height:220px}
 .gradient-stage:after{background:linear-gradient(90deg,transparent 0 49.7%,var(--line) 49.7% 50%,transparent 50%),linear-gradient(0deg,transparent 0 49.7%,var(--line) 49.7% 50%,transparent 50%)}
 .stage-cross{left:50%;top:50%}
 .stage-count{bottom:16px;right:16px;font-size:9px}
 .stage-arrows{bottom:12px;left:16px}
 .category-bar{grid-template-columns:repeat(2,1fr);min-height:unset}
 .category-bar a{min-height:58px;padding:0 12px;font-size:12px;border-bottom:1px solid var(--line)}
 .category-bar a:nth-child(odd){border-left:1px solid var(--line)}
 .category-bar a:nth-child(even){border-right:1px solid var(--line)}
 .footer{min-height:48px;font-size:7px;letter-spacing:.08em}
 .footer span:first-child{display:none}
 .menu-panel{top:65px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="site" id="site">
<header class="header">
 <a class="brand" href="index.html" aria-label="AKASHI home">
  <svg class="mark" viewBox="0 0 1246 245" role="img" aria-label="AKA monogram" xmlns="http://www.w3.org/2000/svg"><g fill="#f2f2f0"><path d="M192,233 L357,234 L469,233 L469,231 L394,161 L385,159 L288,159 L277,162 L267,168 Z"/><path d="M745,158 L817,224 L834,233 L1056,232 L985,163 L973,158 L844,156 Z"/><path d="M720,140 L723,143 L740,145 L852,144 L866,136 L915,95 L924,91 L934,91 L943,95 L1085,227 L1098,233 L1231,233 L1082,100 L994,18 L981,12 L880,13 L849,35 Z"/><path d="M14,233 L92,234 L139,233 L155,230 L176,215 L310,104 L330,91 L343,91 L351,95 L455,190 L502,230 L519,233 L635,232 L635,230 L473,82 L395,14 L389,12 L287,12 L272,21 Z"/><path d="M539,115 L544,122 L651,219 L666,230 L702,233 L799,232 L795,225 L685,126 L685,118 L843,11 L687,9 L681,11 Z"/><path d="M422,10 L527,104 L546,89 L548,9 Z"/></g></svg>
  <span class="brand-name">AKASHI</span>
 </a>
 <nav class="header-right" aria-label="Main navigation"><a href="art.html">Work</a><a href="art.html">Archive</a><a href="art.html">About</a><a href="mailto:">Contact</a></nav>
 <button class="menu" aria-label="Open navigation" aria-expanded="false" aria-controls="menu-panel">MENU</button>
</header>
<nav class="menu-panel" id="menu-panel" aria-label="Mobile navigation"><a href="art.html">Work / Art archive</a><a href="art.html?filter=systems">Generative</a><a href="art.html?filter=photography">Photography</a><a href="art.html?filter=experimental">Experimental</a></nav>
<main class="hero">
 <section class="hero-copy">
  <div class="eyebrow">Independent visual practice / 2026</div>
  <h1>AKASHI</h1>
  <div class="subline">Visual archive</div>
  <div class="rule"></div>
  <div class="hero-index">01 / 03 &nbsp; — &nbsp; Selected entry</div>
 </section>
 <section class="gradient-stage" aria-label="Generative gradient field">
  <span class="stage-cross" aria-hidden="true"></span>
  <span class="stage-arrows" aria-hidden="true">‹ &nbsp; ›</span>
  <span class="stage-count">01 / 03</span>
 </section>
</main>
<nav class="category-bar" aria-label="Explore work">
 <a href="art.html"><span class="num">01</span>Art</a>
 <a href="art.html?filter=systems"><span class="num">02</span>Generative</a>
 <a href="art.html?filter=photography"><span class="num">03</span>Photography</a>
 <a href="art.html?filter=experimental"><span class="num">04</span>Experimental</a>
</nav>
<footer class="footer"><span>Independent creative practice</span><span>AKASHI / Selected work</span><span>© <span id="year"></span></span></footer>
</div>
<script>
/* Each fresh page load selects a new colour atmosphere while preserving the AXIS GRID composition. */
const palettes=[
 {a:"#ff6a00",b:"#6b00c9",x:"78%",y:"78%"},
 {a:"#ff3d75",b:"#5b20d8",x:"84%",y:"72%"},
 {a:"#ff8a00",b:"#b000b8",x:"76%",y:"84%"},
 {a:"#e83e8c",b:"#3f36d9",x:"70%",y:"76%"},
 {a:"#ff4d1c",b:"#7a16d1",x:"88%",y:"82%"},
 {a:"#f044b5",b:"#5424b8",x:"72%",y:"88%"},
 {a:"#ff5c35",b:"#3922c7",x:"82%",y:"70%"},
 {a:"#d92f91",b:"#6d22d2",x:"75%",y:"80%"}
];
let previous=-1;
try{previous=Number(sessionStorage.getItem("akaGradientIndex")??-1)}catch(e){}
let choice=Math.floor(Math.random()*palettes.length);
if(palettes.length>1&&choice===previous)choice=(choice+1+Math.floor(Math.random()*(palettes.length-1)))%palettes.length;
const palette=palettes[choice];
const site=document.getElementById("site");
site.style.setProperty("--glow-a",palette.a);
site.style.setProperty("--glow-b",palette.b);
site.style.setProperty("--hot-x",palette.x);
site.style.setProperty("--hot-y",palette.y);
try{sessionStorage.setItem("akaGradientIndex",String(choice))}catch(e){}
const menu=document.querySelector(".menu"),panel=document.querySelector(".menu-panel");
menu.addEventListener("click",()=>{const open=panel.classList.toggle("open");menu.setAttribute("aria-expanded",String(open));menu.setAttribute("aria-label",open?"Close navigation":"Open navigation");menu.textContent=open?"CLOSE":"MENU"});
panel.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{panel.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.textContent="MENU"}));
document.getElementById("year").textContent=new Date().getFullYear();
</script>
</body>
</html>
