<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070708">
<meta name="description" content="AKASHI — visual archive and independent creative practice.">
<title>AKASHI — Visual Archive</title>
<style>
:root{color-scheme:dark;--fg:#f5f3f6;--line:rgba(255,255,255,.22);--gutter:clamp(22px,4.8vw,78px);--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070708;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100svh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.home{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;padding:0 var(--gutter);display:flex;flex-direction:column;background:#070708}
.home:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at var(--hot-x,82%) var(--hot-y,78%),var(--glow-a,#ff6a00) 0,transparent 37%),radial-gradient(ellipse at 65% 66%,var(--glow-b,#6b00c9),transparent 43%),#070708}
.home:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent calc(53.5% - .5px),var(--line) 53.5%,transparent calc(53.5% + .5px)),linear-gradient(0deg,transparent calc(30% - .5px),var(--line) 30%,transparent calc(30% + .5px)),linear-gradient(0deg,transparent calc(74% - .5px),var(--line) 74%,transparent calc(74% + .5px));opacity:.9}
.header{height:112px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{display:block;width:100px;height:40px}
.logo svg{display:block;width:100%;height:100%}
.menu-button{width:54px;height:54px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:12px;cursor:pointer}
.menu-button span{display:block;width:100%;height:2px;background:#f4f2f5;transition:transform .22s,opacity .22s}
.menu-button[aria-expanded=true] span:first-child{transform:translateY(4.5px) rotate(45deg)}
.menu-button[aria-expanded=true] span:last-child{transform:translateY(-4.5px) rotate(-45deg)}
.menu-panel{position:absolute;z-index:8;top:91px;right:var(--gutter);width:min(300px,calc(100vw - 2*var(--gutter)));padding:25px 28px;background:rgba(10,10,13,.96);border:1px solid var(--line);backdrop-filter:blur(18px);display:none;flex-direction:column;gap:0}
.menu-panel.open{display:flex}
.menu-panel a{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.12);font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#e9e5eb}
.menu-panel a:last-child{border-bottom:0}
.menu-panel a:hover{color:#fff;padding-left:5px}
.identity{flex:1;min-height:350px;display:flex;align-items:center;position:relative}
.identity-copy{padding:0 0 4vh 1.2vw;position:relative;z-index:2}
.hero-mark{display:block;width:clamp(300px,39vw,610px);height:auto;max-width:100%;overflow:visible}.hero-mark svg{display:block;width:100%;height:auto}.hero-mark .reg{font:32px Arial,sans-serif;fill:#f5f3f6}.descriptor{margin:24px 0 0 8px;font-size:clamp(9px,.85vw,12px);letter-spacing:.62em;text-transform:uppercase;color:rgba(255,255,255,.84)}
.descriptor{margin:24px 0 0 8px;font-size:clamp(9px,.85vw,12px);letter-spacing:.62em;text-transform:uppercase;color:rgba(255,255,255,.84)}
.identity-rule{margin:44px 0 0 8px;width:64px;height:2px;background:#f4f0f5}
.feature{width:min(530px,44vw);margin:0 0 8vh auto;display:grid;grid-template-columns:3px 1fr 38px;gap:27px;align-items:stretch;position:relative;z-index:2}
.feature-rule{background:rgba(255,255,255,.92)}
.feature-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.feature-kicker{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;color:rgba(255,255,255,.9)}
.feature-title{font-family:Arial,Helvetica,sans-serif;font-size:clamp(22px,2.25vw,34px);font-weight:300;letter-spacing:.035em;line-height:1.12;text-transform:uppercase;max-width:520px}
.feature-subtitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin-top:12px;color:rgba(255,255,255,.88)}
.feature-link{align-self:end;font-size:31px;font-weight:200;line-height:1;padding-bottom:2px;transition:transform .2s}
.feature:hover .feature-link{transform:translateX(6px)}
.feature-note{font:9px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.76);margin-top:28px}
.footer{height:44px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);font:9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.55)}
@media(max-width:700px){
 .home{padding:0 20px}
 .home:after{background:linear-gradient(90deg,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),linear-gradient(0deg,transparent calc(25% - .5px),var(--line) 25%,transparent calc(25% + .5px)),linear-gradient(0deg,transparent calc(68% - .5px),var(--line) 68%,transparent calc(68% + .5px))}
 .header{height:82px}
 .logo{width:75px;height:32px}
 .menu-button{width:48px;height:48px}
 .menu-panel{top:69px;right:20px}
 .identity{min-height:0;flex:1;align-items:center;padding:0 0 7vh}
 .identity-copy{padding:0 0 0 1px}
 .hero-mark{width:min(88vw,430px)}
 .descriptor{font-size:9px;letter-spacing:.43em;margin:18px 0 0 5px}
 .identity-rule{margin:30px 0 0 5px;width:48px}
 .feature{width:100%;margin:0 0 6vh;grid-template-columns:2px 1fr 30px;gap:17px;min-height:125px}
 .feature-kicker{font-size:9px;margin-bottom:12px}
 .feature-title{font-size:clamp(18px,5.4vw,25px);letter-spacing:.07em}
 .feature-subtitle{font-size:9px;letter-spacing:.19em;line-height:1.6}
 .feature-note{font-size:8px;margin-top:17px}
 .feature-link{font-size:27px}
 .footer{height:38px;font-size:7px;letter-spacing:.08em}
 .footer span:first-child{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="home" id="home">
 <header class="header">

<script>
const palettes=[
 {a:"#ff6a00",b:"#6b00c9",x:"82%",y:"78%"},
 {a:"#ff3d75",b:"#5b20d8",x:"85%",y:"74%"},
 {a:"#ff8a00",b:"#b000b8",x:"76%",y:"84%"},
 {a:"#e83e8c",b:"#3f36d9",x:"72%",y:"77%"},
 {a:"#ff4d1c",b:"#7a16d1",x:"88%",y:"82%"},
 {a:"#f044b5",b:"#5424b8",x:"74%",y:"88%"},
 {a:"#ff5c35",b:"#3922c7",x:"82%",y:"70%"},
 {a:"#d92f91",b:"#6d22d2",x:"75%",y:"80%"}
];
let previous=-1;try{previous=Number(sessionStorage.getItem("akaGradientIndex")??-1)}catch(e){}
let choice=Math.floor(Math.random()*palettes.length);if(palettes.length>1&&choice===previous)choice=(choice+1+Math.floor(Math.random()*(palettes.length-1)))%palettes.length;
const palette=palettes[choice],home=document.getElementById("home");home.style.setProperty("--glow-a",palette.a);home.style.setProperty("--glow-b",palette.b);home.style.setProperty("--hot-x",palette.x);home.style.setProperty("--hot-y",palette.y);try{sessionStorage.setItem("akaGradientIndex",String(choice))}catch(e){}
const menu=document.querySelector(".menu-button"),panel=document.querySelector(".menu-panel");menu.addEventListener("click",()=>{const open=panel.classList.toggle("open");menu.setAttribute("aria-expanded",String(open));menu.setAttribute("aria-label",open?"Close menu":"Open menu")});panel.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{panel.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.setAttribute("aria-label","Open menu")}));document.getElementById("year").textContent=new Date().getFullYear();
</script>
