<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="AKASHI — selected work across art, generative systems, photography and experimental practice.">
<title>AKASHI — Work</title>
<style>
:root{color-scheme:dark;--bg:#080808;--fg:#f2f2f0;--muted:#858585;--line:rgba(255,255,255,.16);--gutter:clamp(24px,6.5vw,104px);--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#050505;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.frame{min-height:calc(100svh - 8px);margin:4px;border:1px solid rgba(255,255,255,.22);border-radius:23px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 30% 50%,#111 0,#090909 50%,#070707 100%)}.chrome{height:46px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;padding:0 23px;background:rgba(255,255,255,.018)}.dot{width:12px;height:12px;border-radius:50%;background:#f0f0ee;box-shadow:0 0 9px #fff2}.site-header{height:104px;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}.wordmark{font-size:clamp(24px,3vw,38px);font-weight:400;letter-spacing:-.065em}.menu{width:48px;height:48px;border:0;background:none;display:grid;align-content:center;gap:6px;cursor:pointer;padding:8px}.menu span{height:2px;width:100%;background:var(--fg);display:block;transition:transform .25s,opacity .25s}.menu[aria-expanded=true] span:first-child{transform:translateY(4px) rotate(45deg)}.menu[aria-expanded=true] span:last-child{transform:translateY(-4px) rotate(-45deg)}.main{min-height:calc(100svh - 158px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);align-items:center;padding:0 var(--gutter) clamp(40px,6vh,80px);gap:clamp(35px,6vw,110px)}.visual{min-height:560px;display:grid;place-items:center;position:relative}.eclipse{width:min(68vw,700px);aspect-ratio:1;border-radius:50%;position:relative;transform:translateX(-4%);background:radial-gradient(circle at 50% 50%,#080808 0 61%,transparent 61.3%);filter:drop-shadow(0 0 28px rgba(255,255,255,.04))}.eclipse:before{content:"";position:absolute;inset:1%;border-radius:50%;background:conic-gradient(from 205deg,transparent 0deg,transparent 90deg,rgba(255,255,255,.03) 133deg,#fff 177deg,#f5f5f5 181deg,rgba(255,255,255,.42) 184deg,transparent 207deg,transparent 360deg);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));filter:blur(.2px)}.eclipse:after{content:"";position:absolute;inset:2%;border-radius:50%;border:1px solid rgba(255,255,255,.055);clip-path:inset(0 0 0 49%)}.visual-label{position:absolute;left:2%;top:50%;transform:translateY(-50%);font-size:clamp(42px,6vw,82px);font-weight:300;letter-spacing:.46em;padding-left:.46em;white-space:nowrap}.work-nav{display:flex;flex-direction:column;gap:0;max-width:420px;width:100%;justify-self:center}.work-link{display:grid;grid-template-columns:48px 1fr 24px;gap:20px;align-items:center;padding:17px 0;border-bottom:1px solid transparent;transition:border-color .2s,transform .2s}.work-link:hover,.work-link:focus-visible{border-color:var(--line);transform:translateX(7px);outline:none}.work-link .number{font:14px var(--mono);color:#bcbcbc}.work-link .name{font-size:clamp(20px,2.1vw,28px);font-weight:400;letter-spacing:-.025em}.work-link .arrow{font-size:18px;color:#8e8e8e;opacity:0;transition:opacity .2s}.work-link:hover .arrow,.work-link:focus-visible .arrow{opacity:1}.footer{padding:0 var(--gutter) 30px;display:flex;justify-content:space-between;gap:20px;font:10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:#777}.menu-panel{position:absolute;z-index:4;top:140px;right:var(--gutter);width:min(320px,calc(100% - 2*var(--gutter)));padding:25px 28px;background:#111;border:1px solid var(--line);display:none;flex-direction:column;gap:18px}.menu-panel.open{display:flex}.menu-panel a{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#d5d5d5}.menu-panel a:hover{color:#fff}
@media(max-width:760px){.frame{min-height:calc(100svh - 8px)}.site-header{height:82px}.main{min-height:unset;grid-template-columns:1fr;gap:8px;padding-top:8px;padding-bottom:48px}.visual{min-height:48svh;max-height:540px}.eclipse{width:min(83vw,520px);transform:translateX(-7%)}.visual-label{left:0;font-size:clamp(36px,10vw,60px);letter-spacing:.35em;padding-left:.35em}.work-nav{width:min(100%,470px);padding:0 5px}.work-link{grid-template-columns:38px 1fr 20px;padding:14px 0}.work-link .name{font-size:22px}.footer{font-size:8px;flex-wrap:wrap}.menu-panel{top:112px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="frame">
<div class="chrome" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<header class="site-header"><a class="wordmark" href="index.html" aria-label="AKASHI work index">AKASHI</a><button class="menu" aria-label="Open navigation" aria-expanded="false" aria-controls="menu-panel"><span></span><span></span></button></header>
<nav class="menu-panel" id="menu-panel" aria-label="Main navigation"><a href="art.html">Art archive</a><a href="art.html?filter=systems">Generative systems</a><a href="art.html?filter=photography">Photography</a><a href="art.html?filter=experimental">Experimental work</a><a href="art.html#music">Music</a><a href="art.html#about">About AKASHI</a><a href="#dop">DOP ↗</a></nav>
<main class="main">
<div class="visual" aria-label="Minimal luminous eclipse artwork"><div class="eclipse"></div><div class="visual-label">WORK</div></div>
<nav class="work-nav" aria-label="Work categories">
<a class="work-link" href="art.html"><span class="number">01</span><span class="name">Art</span><span class="arrow">↗</span></a>
<a class="work-link" href="art.html?filter=systems"><span class="number">02</span><span class="name">Generative</span><span class="arrow">↗</span></a>
<a class="work-link" href="art.html?filter=photography"><span class="number">03</span><span class="name">Photography</span><span class="arrow">↗</span></a>
<a class="work-link" href="art.html?filter=experimental"><span class="number">04</span><span class="name">Experimental</span><span class="arrow">↗</span></a>
</nav>
</main>
<footer class="footer"><span>Independent creative practice</span><span>AKASHI / Selected work</span><span>© <span id="year"></span></span></footer>
</div>
<script>
const menu=document.querySelector('.menu'),panel=document.querySelector('.menu-panel');menu.addEventListener('click',()=>{const open=panel.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close navigation':'Open navigation')});panel.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{panel.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation')}));document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body></html>
